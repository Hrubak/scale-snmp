[package]
name = "scale-api"
version = "0.6.0"
edition = "2021"
description = "Windows UI for SC//HyperCore REST API tasks"
publish = false

[[bin]]
name = "ScaleAPI"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui_extras = "0.31"
egui-winit = "0.31"
winit = "0.30"
softbuffer = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
regex = "1"
base64 = "0.22"

[features]
# Keep the Windows console window: startup messages print to the terminal.
console = []

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
