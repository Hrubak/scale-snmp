name: Build ScaleAPI.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Build console variant (troubleshooting)
        shell: pwsh
        run: |
          Copy-Item target/release/ScaleAPI.exe ScaleAPI.exe
          cargo build --release --locked --features console
          Copy-Item target/release/ScaleAPI.exe ScaleAPI-console.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ScaleAPI-windows-x64
          path: |
            ScaleAPI.exe
            ScaleAPI-console.exe
          if-no-files-found: error
